<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <img src="logo.jpg" alt="Logo">
    <div class="links">
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#website">Website</a>
    </div>
  </nav>

  <!-- Profile card -->
  <div class="card">
    <h1>Niraj Yadav</h1>

    <img class="photo" src="photo.jpeg" alt="Student Photo">

    <h2 id="about">About Me</h2>
    <p>Hello! My name is Niraj Yadav. I am a computer science student and I am learning HTML, CSS and JavaScript.</p>

    <h2 id="skills">My Skills</h2>
    <ul>
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
      <li>C#</li>
    </ul>

    <h2 id="website">My Website</h2>
    <p><a href="https://www.youtube.com/" target="_blank">Visit My Website</a></p>
  </div>

</body>
</html>
